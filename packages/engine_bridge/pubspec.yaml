name: abqari_bridge
description: Runs the full ABQARI mathematics engine (Python + SymPy) inside the app and turns its answers into the device engine's result types.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  abqari_engine:
    path: ../math_engine
  serious_python: ^4.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
