name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -r backend/math_solver/requirements.txt
      - run: python -m pytest
        env:
          ABQARI_REQUIRE_SYMPY: "1"

  packages:
    name: package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [learning_core, localization, math_engine, math_view, shared_ui]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Test (Flutter packages with flutter test, pure Dart with dart test)
        run: |
          if grep -q "flutter_test:" pubspec.yaml; then flutter test; else dart test; fi

  flutter:
    name: flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [abqari_edu, abqari_math]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Report APK
        run: ls -la build/app/outputs/flutter-apk/

  ios:
    name: ios (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [abqari_edu, abqari_math]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iOS
        run: |
          if flutter build ios --debug --no-codesign -v > ios-build.log 2>&1; then
            tail -n 5 ios-build.log
          else
            echo "::group::Device build failed - last lines of the verbose log"
            grep -nE "error:|Signing|requires a development team|CODE_SIGN|failed" ios-build.log | tail -n 40 || true
            tail -n 60 ios-build.log
            echo "::endgroup::"
            echo "::warning::iOS device build (unsigned) failed for ${{ matrix.app }}; checking the simulator build instead."
            flutter build ios --simulator --debug
          fi
