# TEMPORARY, one-off: generates the android/ and ios/ folders with the real
# Flutter tool and commits them to this branch. Removed once it has run.
name: bootstrap-platforms
on:
  push:
    branches: [phase-2]
    paths: ['.github/workflows/bootstrap-platforms.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Generate platform folders
        run: |
          for app in abqari_edu abqari_math; do
            (cd apps/$app && flutter create --org com.abqari --project-name $app --platforms=android,ios . && flutter pub get)
          done
      - name: Show what was generated
        run: git status --short | head -200
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apps: generate android/ and ios/ folders with flutter create (Flutter stable)"
          git push
