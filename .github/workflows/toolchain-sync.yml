# Resolves dependencies (refreshing the apps' lockfiles) and applies `dart format`
# with the real Flutter toolchain, then commits the result to the same branch.
#
# Exists because not every development environment has Flutter installed.
# Request a run by changing .github/toolchain-sync-request on a work branch,
# or run it manually from the Actions tab. It never runs on main.
name: toolchain-sync
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/toolchain-sync-request']
permissions:
  contents: write
jobs:
  sync:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve and format
        run: |
          for dir in packages/* apps/*; do
            (cd "$dir" && flutter pub get && dart format lib test)
          done
      - run: git status --short
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh lockfiles and apply dart format (toolchain-sync)"
            git push
          fi
