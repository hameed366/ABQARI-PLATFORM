# Builds installable preview copies of both apps and publishes them as a
# GitHub pre-release, for trying the apps on real phones before the stores:
#   * Android: release APK (arm64), signed with the debug key — installs directly.
#   * iOS: UNSIGNED .ipa — must be signed on the user's side (e.g. a sideloading
#     signer). Not a store build.
# Both carry the backend's public address and key (config/cloud.public.json).
#
# Request a build by changing .github/preview-request (any branch), or run it
# from the Actions tab.
name: preview-release
on:
  workflow_dispatch:
  push:
    paths: ['.github/preview-request']
permissions:
  contents: write
env:
  VERSION: "0.8.0"
  SERIOUS_PYTHON_VERSION: "3.12"
  SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/apps/abqari_math/build-python/site-packages
  SERIOUS_PYTHON_APP: ${{ github.workspace }}/apps/abqari_math/build-python/app

jobs:
  android:
    name: android (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: abqari_edu
            label: ABQARI-EDU
          - app: abqari_math
            label: ABQARI-MATH
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Free disk space (NDK + Python packages + Gradle need room)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Package the embedded Python engine
        if: matrix.app == 'abqari_math'
        run: ../../tools/package_python_engine.sh Android
      - name: Build release APK (arm64)
        run: |
          # Gradle sometimes fails to fetch plugins (rate limits); try up to 3 times.
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi --target-platform android-arm64 \
                --build-name=$VERSION --build-number=${{ github.run_number }} \
                --dart-define-from-file=../../config/cloud.public.json; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::Android build attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             ../../dist/${{ matrix.label }}-$VERSION-android-arm64.apk
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: ios (${{ matrix.app }})
    runs-on: macos-latest
    env:
      SERIOUS_PYTHON_BUNDLE_ID: com.abqari.abqariMath
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: abqari_edu
            label: ABQARI-EDU
          - app: abqari_math
            label: ABQARI-MATH
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Package the embedded Python engine
        if: matrix.app == 'abqari_math'
        run: ../../tools/package_python_engine.sh iOS
      - name: Build unsigned release app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=$VERSION --build-number=${{ github.run_number }} \
            --dart-define-from-file=../../config/cloud.public.json
      - name: Package as .ipa (Payload/Runner.app)
        run: |
          mkdir -p ../../dist ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry ../../../dist/${{ matrix.label }}-$VERSION-ios-unsigned.ipa Payload)
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.app }}
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="preview-$VERSION-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" --prerelease \
            --title "ABQARI preview $VERSION (build ${{ github.run_number }})" \
            --notes-file .github/preview-notes.md
